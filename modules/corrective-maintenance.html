<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Corrective Maintenance — PowerCore EMS</title>
  <meta name="description" content="Log and manage corrective maintenance work orders for the 29MW Power Plant."/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/module.css"/>
</head>
<body class="dash-body">
<header class="topbar" id="topbar"></header>

<main class="dash-main">
  <div class="mod-header">
    <div class="mod-title-row">
      <div class="mod-icon-wrap" style="background:linear-gradient(135deg,rgba(255,71,87,0.15),rgba(255,107,53,0.1));border-color:rgba(255,71,87,0.25);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff4757" stroke-width="1.7" stroke-linecap="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
      </div>
      <div class="mod-title">
        <h1>Corrective Maintenance</h1>
        <p>Log and track all repair and fault-fixing work orders</p>
      </div>
    </div>
    <div class="mod-actions">
      <button class="btn-primary" onclick="openAddModal()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Work Order
      </button>
    </div>
  </div>

  <!-- Stats Row -->
  <div class="mod-stats-row" id="cmStats"></div>

  <!-- Filters -->
  <div class="filter-bar">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search by equipment, technician, or problem…" oninput="renderTable()"/>
    </div>
    <select class="filter-select" id="filterStatus" onchange="renderTable()">
      <option value="">All Statuses</option>
      <option value="open">Open</option>
      <option value="in-progress">In Progress</option>
      <option value="closed">Closed</option>
    </select>
    <select class="filter-select" id="filterPriority" onchange="renderTable()">
      <option value="">All Priorities</option>
      <option value="critical">Critical</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
    <input type="date" class="filter-select" id="filterFrom" onchange="renderTable()" title="From date"/>
    <input type="date" class="filter-select" id="filterTo"   onchange="renderTable()" title="To date"/>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>#</th><th>Date</th><th>Equipment / Location</th><th>Problem</th><th>Technician</th><th>Priority</th><th>Status</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="cmTableBody"></tbody>
    </table>
    <div id="cmEmpty" class="empty-state" style="display:none;">
      <div class="empty-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff4757" stroke-width="1.5" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
      <h3>No work orders found</h3>
      <p>No corrective maintenance records match your filters. Click "New Work Order" to add one.</p>
    </div>
  </div>
</main>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="cmModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h2 id="cmModalTitle">New Work Order</h2>
      <button class="modal-close" onclick="closeModal('cmModal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="cm_id"/>
      <div class="form-grid">
        <div class="form-field">
          <label>Date of Fault / Work *</label>
          <input type="date" id="cm_date"/>
        </div>
        <div class="form-field">
          <label>Priority *</label>
          <select id="cm_priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>
        <div class="form-field">
          <label>Equipment / Device *</label>
          <input type="text" id="cm_equipment" placeholder="e.g. Transformer T-2, MV Switchgear"/>
        </div>
        <div class="form-field">
          <label>Location</label>
          <input type="text" id="cm_location" placeholder="e.g. Generator Hall, Control Room"/>
        </div>
        <div class="form-field full">
          <label>Problem Description *</label>
          <textarea id="cm_problem" placeholder="Describe the fault or problem observed…" rows="3"></textarea>
        </div>
        <div class="form-field full">
          <label>Action Taken / Work Done</label>
          <textarea id="cm_action" placeholder="Describe what was done to fix the problem…" rows="3"></textarea>
        </div>
        <div class="form-field">
          <label>Technician / Performed By *</label>
          <select id="cm_tech">
            <option value="">Select technician</option>
          </select>
        </div>
        <div class="form-field">
          <label>Work Duration (hours)</label>
          <input type="number" id="cm_duration" placeholder="e.g. 3.5" step="0.5" min="0"/>
        </div>
        <div class="form-field">
          <label>Parts Used</label>
          <input type="text" id="cm_parts" placeholder="List parts replaced or used"/>
        </div>
        <div class="form-field">
          <label>Status *</label>
          <select id="cm_status">
            <option value="open">Open</option>
            <option value="in-progress">In Progress</option>
            <option value="closed">Closed</option>
          </select>
        </div>
        <div class="form-field full">
          <label>Notes / Remarks</label>
          <textarea id="cm_notes" placeholder="Any additional notes, recommendations…" rows="2"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('cmModal')">Cancel</button>
      <button class="btn-primary" onclick="saveRecord()">Save Work Order</button>
    </div>
  </div>
</div>

<!-- View Detail Modal -->
<div class="modal-overlay" id="cmViewModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h2>Work Order Detail</h2>
      <button class="modal-close" onclick="closeModal('cmViewModal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="cmViewBody"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('cmViewModal')">Close</button>
      <button class="btn-primary" id="cmViewEditBtn">Edit</button>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const session = DB.Session.require();
  if (!session) return;
  renderTopbar('Corrective Maintenance');
  document.getElementById('cm_date').value = DB.fmt.today();
  renderStats();
  renderTable();
  populateTechDropdown();
});

function populateTechDropdown() {
  const sel = document.getElementById('cm_tech');
  const users = DB.Users.getActive();
  sel.innerHTML = '<option value="">Select technician</option>' + users.map(u => `<option value="${u.name}">${u.name} — ${u.role}</option>`).join('');
}

function renderStats() {
  const s = DB.Corrective.getStats();
  document.getElementById('cmStats').innerHTML = `
    <div class="stat-mini"><div class="stat-mini-val" style="color:#00d4ff;">${s.total}</div><div class="stat-mini-lbl">Total Work Orders</div></div>
    <div class="stat-mini"><div class="stat-mini-val" style="color:#ff4757;">${s.open}</div><div class="stat-mini-lbl">Open</div></div>
    <div class="stat-mini"><div class="stat-mini-val" style="color:#f0a500;">${s.inProgress}</div><div class="stat-mini-lbl">In Progress</div></div>
    <div class="stat-mini"><div class="stat-mini-val" style="color:#00e676;">${s.closed}</div><div class="stat-mini-lbl">Closed</div></div>
  `;
}

function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const fStatus   = document.getElementById('filterStatus').value;
  const fPriority = document.getElementById('filterPriority').value;
  const fFrom = document.getElementById('filterFrom').value;
  const fTo   = document.getElementById('filterTo').value;

  let data = DB.Corrective.getAll().filter(r => {
    if (fStatus   && r.status   !== fStatus)   return false;
    if (fPriority && r.priority !== fPriority) return false;
    if (fFrom && r.date < fFrom) return false;
    if (fTo   && r.date > fTo)   return false;
    if (search) {
      const hay = [r.equipment, r.technician, r.problemDescription, r.location, r.actionTaken].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  const tbody = document.getElementById('cmTableBody');
  const empty = document.getElementById('cmEmpty');

  if (!data.length) {
    tbody.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  const prioClass = { low:'priority-low', medium:'priority-medium', high:'priority-high', critical:'priority-critical' };

  tbody.innerHTML = data.map((r, i) => `
    <tr>
      <td class="td-muted" style="font-family:'JetBrains Mono',monospace;font-size:12px;">#${String(i+1).padStart(3,'0')}</td>
      <td class="td-muted">${DB.fmt.date(r.date)}</td>
      <td>
        <div class="td-main">${esc(r.equipment)}</div>
        ${r.location ? `<div class="td-sub">${esc(r.location)}</div>` : ''}
      </td>
      <td style="max-width:220px;">
        <div class="td-main" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;">${esc(r.problemDescription)}</div>
        ${r.partsUsed ? `<div class="td-sub">Parts: ${esc(r.partsUsed)}</div>` : ''}
      </td>
      <td>
        <div class="td-main">${esc(r.technician)}</div>
        ${r.duration ? `<div class="td-sub">${r.duration}h</div>` : ''}
      </td>
      <td><span class="${prioClass[r.priority] || 'priority-medium'}">● ${(r.priority||'').toUpperCase()}</span></td>
      <td><span class="badge badge-${r.status}">${r.status}</span></td>
      <td>
        <div class="td-actions">
          <button class="btn-icon" onclick="viewRecord('${r.id}')" title="View Details">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button class="btn-icon" onclick="editRecord('${r.id}')" title="Edit">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn-icon del" onclick="deleteRecord('${r.id}')" title="Delete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </td>
    </tr>
  `).join('');
}

function openAddModal() {
  document.getElementById('cm_id').value = '';
  document.getElementById('cmModalTitle').textContent = 'New Work Order';
  document.getElementById('cm_date').value = DB.fmt.today();
  document.getElementById('cm_equipment').value = '';
  document.getElementById('cm_location').value = '';
  document.getElementById('cm_problem').value = '';
  document.getElementById('cm_action').value = '';
  document.getElementById('cm_parts').value = '';
  document.getElementById('cm_duration').value = '';
  document.getElementById('cm_notes').value = '';
  document.getElementById('cm_status').value = 'open';
  document.getElementById('cm_priority').value = 'medium';
  populateTechDropdown();
  openModal('cmModal');
}

function editRecord(id) {
  const r = DB.Corrective.getById(id);
  if (!r) return;
  document.getElementById('cm_id').value = r.id;
  document.getElementById('cmModalTitle').textContent = 'Edit Work Order';
  document.getElementById('cm_date').value = r.date || '';
  document.getElementById('cm_equipment').value = r.equipment || '';
  document.getElementById('cm_location').value = r.location || '';
  document.getElementById('cm_problem').value = r.problemDescription || '';
  document.getElementById('cm_action').value = r.actionTaken || '';
  document.getElementById('cm_parts').value = r.partsUsed || '';
  document.getElementById('cm_duration').value = r.duration || '';
  document.getElementById('cm_notes').value = r.notes || '';
  document.getElementById('cm_status').value = r.status || 'open';
  document.getElementById('cm_priority').value = r.priority || 'medium';
  populateTechDropdown();
  document.getElementById('cm_tech').value = r.technician || '';
  closeModal('cmViewModal');
  openModal('cmModal');
}

function viewRecord(id) {
  const r = DB.Corrective.getById(id);
  if (!r) return;
  const prioColors = { low:'var(--text-secondary)', medium:'#38bdf8', high:'#f0a500', critical:'#ff4757' };
  document.getElementById('cmViewBody').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
      <div><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;">Date</div><div style="font-weight:600;">${DB.fmt.date(r.date)}</div></div>
      <div><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;">Status</div><span class="badge badge-${r.status}">${r.status}</span></div>
      <div><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;">Equipment</div><div style="font-weight:600;">${esc(r.equipment)}</div></div>
      <div><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;">Location</div><div>${esc(r.location)||'—'}</div></div>
      <div><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;">Technician</div><div style="font-weight:600;">${esc(r.technician)}</div></div>
      <div><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;">Priority</div><span style="color:${prioColors[r.priority]};font-weight:700;">● ${(r.priority||'').toUpperCase()}</span></div>
      <div style="grid-column:1/-1;"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;">Problem Description</div><div style="background:rgba(0,0,0,0.2);padding:12px;border-radius:8px;font-size:14px;line-height:1.6;">${esc(r.problemDescription)||'—'}</div></div>
      <div style="grid-column:1/-1;"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;">Action Taken</div><div style="background:rgba(0,0,0,0.2);padding:12px;border-radius:8px;font-size:14px;line-height:1.6;">${esc(r.actionTaken)||'—'}</div></div>
      ${r.partsUsed ? `<div><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;">Parts Used</div><div>${esc(r.partsUsed)}</div></div>` : ''}
      ${r.duration  ? `<div><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;">Duration</div><div>${r.duration} hours</div></div>` : ''}
      ${r.notes ? `<div style="grid-column:1/-1;"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;">Notes</div><div style="color:var(--text-secondary);">${esc(r.notes)}</div></div>` : ''}
    </div>
  `;
  document.getElementById('cmViewEditBtn').onclick = () => editRecord(id);
  openModal('cmViewModal');
}

function saveRecord() {
  const id       = document.getElementById('cm_id').value;
  const date     = document.getElementById('cm_date').value;
  const equip    = document.getElementById('cm_equipment').value.trim();
  const tech     = document.getElementById('cm_tech').value;
  const problem  = document.getElementById('cm_problem').value.trim();
  const status   = document.getElementById('cm_status').value;
  const priority = document.getElementById('cm_priority').value;

  if (!date || !equip || !tech || !problem) {
    showToast('Date, equipment, technician, and problem are required', 'error'); return;
  }

  const data = {
    date, equipment: equip,
    location:           document.getElementById('cm_location').value.trim(),
    problemDescription: problem,
    actionTaken:        document.getElementById('cm_action').value.trim(),
    technician:         tech,
    partsUsed:          document.getElementById('cm_parts').value.trim(),
    duration:           document.getElementById('cm_duration').value,
    notes:              document.getElementById('cm_notes').value.trim(),
    status, priority,
  };

  if (id) { DB.Corrective.update(id, data); showToast('Work order updated', 'success'); }
  else     { DB.Corrective.add(data);        showToast('Work order added', 'success'); }

  closeModal('cmModal');
  renderStats();
  renderTable();
}

function deleteRecord(id) {
  if (!confirm('Delete this work order permanently?')) return;
  DB.Corrective.remove(id);
  renderStats();
  renderTable();
  showToast('Record deleted', 'info');
}
</script>
</body>
</html>
