<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Training Course — PowerCore EMS</title>
  <meta name="description" content="Track employee training seminars and certifications for the 29MW Power Plant electrical team."/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/module.css"/>
</head>
<body class="dash-body">
<header class="topbar" id="topbar"></header>

<main class="dash-main">
  <div class="mod-header">
    <div class="mod-title-row">
      <div class="mod-icon-wrap" style="background:linear-gradient(135deg,rgba(244,63,94,0.15),rgba(168,85,247,0.1));border-color:rgba(244,63,94,0.25);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fb7185" stroke-width="1.7" stroke-linecap="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>
      <div class="mod-title">
        <h1>Training Course</h1>
        <p>Track employee seminars, training sessions, and certifications</p>
      </div>
    </div>
    <div class="mod-actions">
      <button class="btn-primary" onclick="openAddModal()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Training Record
      </button>
    </div>
  </div>

  <!-- Stats -->
  <div class="mod-stats-row" id="trStats"></div>

  <!-- Tabs: All Records / By Employee -->
  <div class="tab-nav">
    <button class="tab-btn active" id="tab-all"      onclick="switchTab('all')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      All Records
    </button>
    <button class="tab-btn" id="tab-emp" onclick="switchTab('emp')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      By Employee
    </button>
  </div>

  <!-- All Records Tab -->
  <div class="tab-panel active" id="panel-all">
    <div class="filter-bar">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-input" id="searchAll" placeholder="Search by title, topic, employee, or conductor…" oninput="renderAllTable()"/>
      </div>
      <select class="filter-select" id="filterEmployee" onchange="renderAllTable()">
        <option value="">All Employees</option>
      </select>
      <input type="date" class="filter-select" id="filterFrom" onchange="renderAllTable()" title="From date"/>
      <input type="date" class="filter-select" id="filterTo"   onchange="renderAllTable()" title="To date"/>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Employee</th><th>Seminar / Course Title</th><th>Topic</th><th>Date</th><th>Duration</th><th>Conducted By</th><th>Certificate</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="allTableBody"></tbody>
      </table>
      <div id="allEmpty" class="empty-state" style="display:none;">
        <div class="empty-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div>
        <h3>No training records</h3>
        <p>No training sessions match your filters. Add the first record using the button above.</p>
      </div>
    </div>
  </div>

  <!-- By Employee Tab -->
  <div class="tab-panel" id="panel-emp">
    <div id="empSummary"></div>
  </div>

</main>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="trModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h2 id="trModalTitle">Add Training Record</h2>
      <button class="modal-close" onclick="closeModal('trModal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="tr_id"/>
      <div class="form-grid">
        <div class="form-field">
          <label>Employee Name *</label>
          <select id="tr_emp">
            <option value="">Select employee</option>
          </select>
        </div>
        <div class="form-field">
          <label>Date of Seminar *</label>
          <input type="date" id="tr_date"/>
        </div>
        <div class="form-field full">
          <label>Seminar / Course Title *</label>
          <input type="text" id="tr_title" placeholder="e.g. High Voltage Safety Refresher"/>
        </div>
        <div class="form-field">
          <label>Topic / Category *</label>
          <select id="tr_topic">
            <option value="">Select topic</option>
            <option>High Voltage Safety</option>
            <option>Electrical Protection Systems</option>
            <option>Transformer Maintenance</option>
            <option>Switchgear Operation</option>
            <option>Generator Maintenance</option>
            <option>Fire Safety</option>
            <option>First Aid</option>
            <option>Control Systems</option>
            <option>Arc Flash Protection</option>
            <option>Power Quality</option>
            <option>IEC Standards</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-field">
          <label>Duration (hours)</label>
          <input type="number" id="tr_duration" placeholder="e.g. 8" step="0.5" min="0"/>
        </div>
        <div class="form-field">
          <label>Conducted By / Trainer</label>
          <input type="text" id="tr_conductor" placeholder="Trainer name or organization"/>
        </div>
        <div class="form-field">
          <label>Training Location / Platform</label>
          <input type="text" id="tr_location" placeholder="e.g. On-site, Online, External"/>
        </div>
        <div class="form-field" style="flex-direction:row;align-items:center;gap:10px;padding-top:24px;">
          <input type="checkbox" id="tr_cert" style="width:18px;height:18px;cursor:pointer;accent-color:#fb7185;"/>
          <label for="tr_cert" style="text-transform:none;font-size:14px;cursor:pointer;letter-spacing:0;">Certificate Issued</label>
        </div>
        <div class="form-field full">
          <label>Notes / Remarks</label>
          <textarea id="tr_notes" placeholder="Any additional notes, key topics covered, action items…" rows="2"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('trModal')">Cancel</button>
      <button class="btn-primary" onclick="saveRecord()">Save Training Record</button>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/shell.js"></script>
<script>
let activeTab = 'all';

document.addEventListener('DOMContentLoaded', () => {
  const session = DB.Session.require();
  if (!session) return;
  renderTopbar('Training Course');
  populateFilters();
  renderStats();
  renderAllTable();
});

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('panel-all').classList.toggle('active', tab === 'all');
  document.getElementById('panel-emp').classList.toggle('active', tab === 'emp');
  document.getElementById('tab-all').classList.toggle('active', tab === 'all');
  document.getElementById('tab-emp').classList.toggle('active', tab === 'emp');
  if (tab === 'emp') renderEmpSummary();
}

function populateFilters() {
  const users = DB.Users.getActive();
  const empFilter = document.getElementById('filterEmployee');
  const trEmp     = document.getElementById('tr_emp');
  empFilter.innerHTML = '<option value="">All Employees</option>' + users.map(u => `<option value="${u.name}">${u.name}</option>`).join('');
  trEmp.innerHTML     = '<option value="">Select employee</option>' + users.map(u => `<option value="${u.name}">${u.name} — ${u.role}</option>`).join('');
}

function renderStats() {
  const all   = DB.Training.getAll();
  const users = DB.Users.getActive();
  const hasTrained = new Set(all.map(r => r.employeeName));
  const certified  = all.filter(r => r.certificate).length;
  const topics     = new Set(all.map(r => r.topic)).size;
  document.getElementById('trStats').innerHTML = `
    <div class="stat-mini"><div class="stat-mini-val" style="color:#fb7185;">${all.length}</div><div class="stat-mini-lbl">Total Sessions Recorded</div></div>
    <div class="stat-mini"><div class="stat-mini-val" style="color:#a855f7;">${hasTrained.size} / ${users.length}</div><div class="stat-mini-lbl">Employees Trained</div></div>
    <div class="stat-mini"><div class="stat-mini-val" style="color:#00e676;">${certified}</div><div class="stat-mini-lbl">Certificates Issued</div></div>
    <div class="stat-mini"><div class="stat-mini-val" style="color:#38bdf8;">${topics}</div><div class="stat-mini-lbl">Training Topics</div></div>
  `;
}

function renderAllTable() {
  const search  = document.getElementById('searchAll').value.toLowerCase();
  const fEmp    = document.getElementById('filterEmployee').value;
  const fFrom   = document.getElementById('filterFrom').value;
  const fTo     = document.getElementById('filterTo').value;

  let data = DB.Training.getAll().filter(r => {
    if (fEmp  && r.employeeName !== fEmp) return false;
    if (fFrom && r.date < fFrom) return false;
    if (fTo   && r.date > fTo)   return false;
    if (search) {
      const hay = [r.employeeName, r.seminarTitle, r.topic, r.conductor, r.notes].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  const tbody = document.getElementById('allTableBody');
  const empty = document.getElementById('allEmpty');
  if (!data.length) { tbody.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';

  tbody.innerHTML = data.map(r => `
    <tr>
      <td>
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f43f5e,#a855f7);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:white;flex-shrink:0;">${getInitials(r.employeeName)}</div>
          <div>
            <div class="td-main">${esc(r.employeeName)}</div>
            <div class="td-sub">${getRole(r.employeeName)}</div>
          </div>
        </div>
      </td>
      <td>
        <div class="td-main">${esc(r.seminarTitle)}</div>
        ${r.location ? `<div class="td-sub">${esc(r.location)}</div>` : ''}
      </td>
      <td><span class="badge" style="background:rgba(244,63,94,0.1);color:#fb7185;">${esc(r.topic)}</span></td>
      <td class="td-muted">${DB.fmt.date(r.date)}</td>
      <td class="td-muted">${r.duration ? r.duration + 'h' : '—'}</td>
      <td class="td-muted">${esc(r.conductor)||'—'}</td>
      <td>
        ${r.certificate
          ? '<span style="color:#00e676;font-weight:700;font-size:12px;">✓ Yes</span>'
          : '<span style="color:var(--text-muted);font-size:12px;">—</span>'}
      </td>
      <td>
        <div class="td-actions">
          <button class="btn-icon" onclick="editRecord('${r.id}')" title="Edit">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn-icon del" onclick="deleteRecord('${r.id}')" title="Delete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </td>
    </tr>
  `).join('');
}

function renderEmpSummary() {
  const users = DB.Users.getActive();
  const recs  = DB.Training.getAll();
  const el    = document.getElementById('empSummary');

  el.innerHTML = users.map(u => {
    const empRecs = recs.filter(r => r.employeeName === u.name).sort((a,b)=>b.date.localeCompare(a.date));
    const totalHours = empRecs.reduce((s, r) => s + Number(r.duration||0), 0);
    const certs = empRecs.filter(r => r.certificate).length;

    return `
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px;">
          <div style="display:flex;align-items:center;gap:14px;">
            <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#f43f5e,#a855f7);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:white;flex-shrink:0;">${getInitials(u.name)}</div>
            <div>
              <div style="font-size:17px;font-weight:700;">${esc(u.name)}</div>
              <div style="font-size:13px;color:var(--text-secondary);">${esc(u.role)}</div>
            </div>
          </div>
          <div style="display:flex;gap:20px;flex-wrap:wrap;">
            <div style="text-align:center;">
              <div style="font-size:22px;font-weight:800;color:#fb7185;">${empRecs.length}</div>
              <div style="font-size:11px;color:var(--text-secondary);">Sessions</div>
            </div>
            <div style="text-align:center;">
              <div style="font-size:22px;font-weight:800;color:#38bdf8;">${totalHours}<span style="font-size:13px;">h</span></div>
              <div style="font-size:11px;color:var(--text-secondary);">Total Hours</div>
            </div>
            <div style="text-align:center;">
              <div style="font-size:22px;font-weight:800;color:#00e676;">${certs}</div>
              <div style="font-size:11px;color:var(--text-secondary);">Certificates</div>
            </div>
          </div>
        </div>
        ${empRecs.length ? `
          <div style="border-top:1px solid var(--border);padding-top:14px;">
            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;">Training History</div>
            ${empRecs.slice(0,5).map(r => `
              <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.03);">
                <div>
                  <div style="font-size:13px;font-weight:600;">${esc(r.seminarTitle)}</div>
                  <div style="font-size:11px;color:var(--text-secondary);">${esc(r.topic)}</div>
                </div>
                <div style="text-align:right;flex-shrink:0;margin-left:12px;">
                  <div style="font-size:12px;color:var(--text-secondary);font-family:'JetBrains Mono',monospace;">${DB.fmt.date(r.date)}</div>
                  ${r.certificate ? '<div style="font-size:10px;color:#00e676;font-weight:700;">✓ CERT</div>' : ''}
                </div>
              </div>`).join('')}
            ${empRecs.length > 5 ? `<div style="font-size:12px;color:var(--text-muted);padding-top:8px;">+${empRecs.length-5} more sessions…</div>` : ''}
          </div>` : `<div style="color:var(--text-muted);font-size:13px;border-top:1px solid var(--border);padding-top:14px;">No training records yet for this employee.</div>`}
      </div>`;
  }).join('');
}

function getInitials(name) {
  return (name||'').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

function getRole(name) {
  const user = DB.Users.getActive().find(u => u.name === name);
  return user ? user.role : '';
}

function openAddModal() {
  document.getElementById('tr_id').value = '';
  document.getElementById('trModalTitle').textContent = 'Add Training Record';
  document.getElementById('tr_date').value = DB.fmt.today();
  document.getElementById('tr_title').value    = '';
  document.getElementById('tr_topic').value    = '';
  document.getElementById('tr_duration').value = '';
  document.getElementById('tr_conductor').value = '';
  document.getElementById('tr_location').value  = '';
  document.getElementById('tr_cert').checked   = false;
  document.getElementById('tr_notes').value    = '';
  populateFilters();
  openModal('trModal');
}

function editRecord(id) {
  const r = DB.Training.getById(id);
  if (!r) return;
  document.getElementById('tr_id').value = r.id;
  document.getElementById('trModalTitle').textContent = 'Edit Training Record';
  document.getElementById('tr_date').value = r.date || '';
  document.getElementById('tr_title').value    = r.seminarTitle || '';
  document.getElementById('tr_topic').value    = r.topic        || '';
  document.getElementById('tr_duration').value = r.duration     || '';
  document.getElementById('tr_conductor').value = r.conductor   || '';
  document.getElementById('tr_location').value  = r.location    || '';
  document.getElementById('tr_cert').checked   = r.certificate  || false;
  document.getElementById('tr_notes').value    = r.notes        || '';
  populateFilters();
  document.getElementById('tr_emp').value = r.employeeName || '';
  openModal('trModal');
}

function saveRecord() {
  const id    = document.getElementById('tr_id').value;
  const emp   = document.getElementById('tr_emp').value;
  const date  = document.getElementById('tr_date').value;
  const title = document.getElementById('tr_title').value.trim();
  const topic = document.getElementById('tr_topic').value;
  if (!emp || !date || !title || !topic) {
    showToast('Employee, date, title, and topic are required', 'error'); return;
  }
  const data = {
    employeeName: emp, date, seminarTitle: title, topic,
    duration:    document.getElementById('tr_duration').value,
    conductor:   document.getElementById('tr_conductor').value.trim(),
    location:    document.getElementById('tr_location').value.trim(),
    certificate: document.getElementById('tr_cert').checked,
    notes:       document.getElementById('tr_notes').value.trim(),
  };
  if (id) { DB.Training.update(id, data); showToast('Training record updated', 'success'); }
  else     { DB.Training.add(data);        showToast('Training record added', 'success'); }
  closeModal('trModal');
  renderStats(); renderAllTable();
  if (activeTab === 'emp') renderEmpSummary();
}

function deleteRecord(id) {
  if (!confirm('Delete this training record permanently?')) return;
  DB.Training.remove(id); renderStats(); renderAllTable();
  showToast('Record deleted', 'info');
}
</script>
</body>
</html>
