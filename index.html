<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PowerCore — Electrical Team Portal</title>
  <meta name="description"
    content="Secure login portal for the 29MW Power Plant Electrical Operations Management System." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="login-body">

  <!-- Animated background particles -->
  <div class="bg-grid"></div>
  <div class="particles" id="particles"></div>

  <!-- Floating power icons -->
  <div class="float-icons">
    <div class="float-icon fi-1">⚡</div>
    <div class="float-icon fi-2">🔌</div>
    <div class="float-icon fi-3">⚙️</div>
    <div class="float-icon fi-4">🔋</div>
    <div class="float-icon fi-5">💡</div>
  </div>

  <div class="login-wrapper">
    <!-- Left Panel -->
    <div class="login-left">
      <div class="login-brand">
        <div class="brand-logo">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <polygon points="24,2 44,12 44,36 24,46 4,36 4,12" fill="none" stroke="url(#hexGrad)" stroke-width="2" />
            <polygon points="24,6 41,14.5 41,33.5 24,42 7,33.5 7,14.5" fill="url(#hexFill)" opacity="0.15" />
            <path d="M27 10L18 26H25L21 38L30 22H23L27 10Z" fill="url(#boltGrad)" />
            <defs>
              <linearGradient id="hexGrad" x1="4" y1="2" x2="44" y2="46">
                <stop offset="0%" stop-color="#00d4ff" />
                <stop offset="100%" stop-color="#f0a500" />
              </linearGradient>
              <linearGradient id="hexFill" x1="4" y1="2" x2="44" y2="46">
                <stop offset="0%" stop-color="#00d4ff" />
                <stop offset="100%" stop-color="#0066ff" />
              </linearGradient>
              <linearGradient id="boltGrad" x1="18" y1="10" x2="30" y2="38">
                <stop offset="0%" stop-color="#f0a500" />
                <stop offset="100%" stop-color="#ff6b00" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div>
          <div class="brand-name">29MW Power Plant</div>
          <div class="brand-sub">Electrical Team Management System</div>
        </div>
      </div>

      <div class="login-hero-text">
        <h1>Electrical Team<br /><span class="gradient-text">Management System</span></h1>
        <p>alw</p>
      </div>

      <!-- Electrical Circuit Animation -->
      <div class="elec-anim-wrap">
        <svg class="elec-circuit" viewBox="0 0 420 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Main horizontal bus bars -->
          <line x1="0" y1="20" x2="420" y2="20" stroke="rgba(0,212,255,0.15)" stroke-width="1.5" />
          <line x1="0" y1="60" x2="420" y2="60" stroke="rgba(0,212,255,0.15)" stroke-width="1.5" />
          <!-- Vertical drops -->
          <line x1="60" y1="20" x2="60" y2="60" stroke="rgba(0,212,255,0.12)" stroke-width="1" />
          <line x1="130" y1="20" x2="130" y2="60" stroke="rgba(0,212,255,0.12)" stroke-width="1" />
          <line x1="210" y1="20" x2="210" y2="60" stroke="rgba(0,212,255,0.12)" stroke-width="1" />
          <line x1="290" y1="20" x2="290" y2="60" stroke="rgba(0,212,255,0.12)" stroke-width="1" />
          <line x1="360" y1="20" x2="360" y2="60" stroke="rgba(0,212,255,0.12)" stroke-width="1" />
          <!-- Glowing junction nodes -->
          <circle cx="60" cy="20" r="3.5" fill="#00d4ff" opacity="0.7">
            <animate attributeName="opacity" values="0.7;1;0.7" dur="2.1s" repeatCount="indefinite" />
          </circle>
          <circle cx="130" cy="60" r="3.5" fill="#00d4ff" opacity="0.5">
            <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1.7s" repeatCount="indefinite" />
          </circle>
          <circle cx="210" cy="20" r="4" fill="#f0a500" opacity="0.8">
            <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite" />
            <animate attributeName="r" values="4;5;4" dur="2.5s" repeatCount="indefinite" />
          </circle>
          <circle cx="290" cy="60" r="3.5" fill="#00d4ff" opacity="0.6">
            <animate attributeName="opacity" values="0.6;1;0.6" dur="1.9s" repeatCount="indefinite" />
          </circle>
          <circle cx="360" cy="20" r="3.5" fill="#00d4ff" opacity="0.5">
            <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.3s" repeatCount="indefinite" />
          </circle>
          <!-- Central lightning bolt glyph -->
          <path d="M207 8 L199 42 H206 L203 72 L221 38 H214 L219 8Z" fill="rgba(240,165,0,0.18)"
            stroke="rgba(240,165,0,0.4)" stroke-width="0.8">
            <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
          </path>
          <!-- Animated "electricity" pulse travelling along top bus -->
          <circle r="3" fill="#00d4ff" filter="url(#blur1)">
            <animateMotion dur="3s" repeatCount="indefinite" path="M0,20 H420" />
            <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" />
          </circle>
          <!-- Second pulse with delay on bottom bus -->
          <circle r="2.5" fill="#a78bfa" filter="url(#blur1)">
            <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M420,60 H0" />
            <animate attributeName="opacity" values="0;0.9;0.9;0" dur="3s" begin="1.5s" repeatCount="indefinite" />
          </circle>
          <!-- Gold pulse on top bus (offset) -->
          <circle r="2" fill="#f0a500" filter="url(#blur1)">
            <animateMotion dur="4.5s" begin="0.8s" repeatCount="indefinite" path="M0,20 H420" />
            <animate attributeName="opacity" values="0;0.8;0.8;0" dur="4.5s" begin="0.8s" repeatCount="indefinite" />
          </circle>
          <defs>
            <filter id="blur1" x="-200%" y="-200%" width="500%" height="500%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" />
            </filter>
          </defs>
        </svg>
      </div>
    </div>

    <!-- Right Panel — Login Form -->
    <div class="login-right">
      <div class="login-card" id="loginCard">
        <div class="login-card-header">
          <div class="lock-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="url(#lockGrad)" stroke-width="1.8"
              stroke-linecap="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              <defs>
                <linearGradient id="lockGrad" x1="3" y1="3" x2="21" y2="22">
                  <stop offset="0%" stop-color="#00d4ff" />
                  <stop offset="100%" stop-color="#0066ff" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <h2>Secure Access</h2>
          <p>Sign in to your operational portal</p>
        </div>

        <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group" id="fgUsername">
            <label for="username">Username</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </span>
              <input type="text" id="username" placeholder="Enter your username" autocomplete="username" />
            </div>
          </div>

          <div class="form-group" id="fgPassword">
            <label for="password">Password</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
              <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
              <button type="button" class="toggle-pass" onclick="togglePass()" id="togglePassBtn"
                aria-label="Toggle password visibility">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe" />
              <span class="check-custom"></span>
              Remember me
            </label>
          </div>

          <div class="error-msg" id="errorMsg">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round">
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            Invalid username or password
          </div>

          <button type="submit" class="btn-login" id="loginBtn">
            <span class="btn-text">Sign In</span>
            <span class="btn-loader" id="btnLoader">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                stroke-linecap="round">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
              </svg>
            </span>
          </button>
        </form>

        <div class="login-footer">
          <div class="secure-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z" />
            </svg>
            Secured Connection
          </div>
          <span>Power Plant EMS v2.0</span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
